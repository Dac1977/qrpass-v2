services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: qrpass
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: qrpass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build: ./apps/api
    restart: always
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://qrpass:${DB_PASSWORD}@db:5432/qrpass
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3000
    ports:
      - "3000:3000"

  web:
    build: ./apps/web
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: ${API_URL}
    ports:
      - "3001:3001"

  nginx:
    image: nginx:alpine
    restart: always
    depends_on:
      - api
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro

volumes:
  postgres_data:
